[project]
name = "notes-api"
version = "0.1.0"
description = "Навчальний REST API для практики GitHub Actions / Docker / DevOps"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI використовує Depends()/Query() у дефолтах аргументів

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
